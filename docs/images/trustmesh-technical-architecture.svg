<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">TrustMesh technical architecture</title>
<desc id="desc">Technical pipeline from browser UI through Node API, synthetic data and three risk agents, decision policy, DRUNIX chaincode submission and readback, local records and analyst review.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#526985"/></marker>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3976c5"/></marker>
  <style>
    .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#132540}.subtitle{font:15px 'Segoe UI',Arial,sans-serif;fill:#5c708a}
    .lane{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.5px;fill:#73849a}
    .head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#172a43}.body{font:14px 'Segoe UI',Arial,sans-serif;fill:#344a65}.small{font:12px 'Segoe UI',Arial,sans-serif;fill:#60748e}.mono{font:12px 'Cascadia Code',Consolas,monospace;fill:#38536f}
  </style>
</defs>
<rect width="1600" height="960" rx="22" fill="#f4f7fb"/>
<text x="46" y="52" class="title">TrustMesh · technical architecture</text>
<text x="46" y="79" class="subtitle">Synthetic pre-settlement screening: request path, graph build, parallel risk scoring, DRUNIX ledger commit and verified response</text>

<text x="48" y="120" class="lane">1 · CLIENT AND API</text>
<rect x="46" y="138" width="320" height="170" rx="16" fill="#fff" stroke="#aebed1" stroke-width="2"/>
<text x="70" y="172" class="head">Analyst workbench</text><text x="70" y="199" class="small">public/index.html · app.js · app.css</text>
<rect x="70" y="220" width="118" height="34" rx="8" fill="#eef4ff"/><text x="129" y="242" text-anchor="middle" class="body">Payment form</text>
<rect x="199" y="220" width="142" height="34" rx="8" fill="#eef4ff"/><text x="270" y="242" text-anchor="middle" class="body">Knowledge graph</text>
<text x="70" y="282" class="small">Search · review · decision tabs</text>

<rect x="420" y="138" width="340" height="170" rx="16" fill="#e9f2ff" stroke="#7ca2d2" stroke-width="2"/>
<text x="446" y="172" class="head">Node.js HTTP API</text><text x="446" y="199" class="small">server.js · JSON routes + static assets</text>
<text x="446" y="230" class="mono">POST /api/transactions/analyze</text>
<text x="446" y="254" class="mono">GET /api/graph · /api/search · /api/entities</text>
<text x="446" y="281" class="small">Validates IDs / INR amount · coordinates agents</text>
<path d="M366 222H410" stroke="#526985" stroke-width="3" marker-end="url(#arrow)"/>

<text x="800" y="120" class="lane">2 · SYNTHETIC DATA AND SCORING</text>
<rect x="800" y="138" width="345" height="170" rx="16" fill="#fff" stroke="#aebed1" stroke-width="2"/>
<text x="826" y="172" class="head">Network data store</text><text x="826" y="199" class="small">server/data-store.cjs · deterministic seed</text>
<text x="826" y="231" class="body">Accounts · banks · merchants</text><text x="826" y="255" class="body">Payment edges · devices · SIM identities</text>
<text x="826" y="282" class="small">Indexes support neighborhood, search and profiles</text>
<path d="M760 222H790" stroke="#526985" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="1182" y="138" width="370" height="170" rx="16" fill="#fff" stroke="#aebed1" stroke-width="2"/>
<text x="1208" y="172" class="head">Graph + search services</text>
<text x="1208" y="202" class="mono">GET /api/graph?focus=…&amp;hops=…</text>
<text x="1208" y="228" class="mono">GET /api/search?q=…</text>
<text x="1208" y="259" class="body">Nodes: account / merchant / device / SIM</text>
<text x="1208" y="283" class="body">Edges: payments + shared identity links</text>
<path d="M1145 222H1172" stroke="#526985" stroke-width="3" marker-end="url(#arrow)"/>

<path d="M972 308V350" stroke="#526985" stroke-width="3" marker-end="url(#arrow)"/>
<text x="48" y="357" class="lane">3 · PARALLEL AGENTS · EACH RETURNS A SCORE AND REASONS</text>
<path d="M590 308V335H326V369M590 335H790V369M790 335H1248V369" fill="none" stroke="#3976c5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#blueArrow)"/>
<rect x="46" y="378" width="400" height="146" rx="16" fill="#eaf4ff" stroke="#8caed4" stroke-width="2"/>
<text x="72" y="414" class="head">Transaction-pattern agent · TVP</text><text x="72" y="446" class="body">Amount vs profile · recent velocity</text><text x="72" y="472" class="body">Unusual payment hour</text><text x="72" y="503" class="small">server/agents/transaction-pattern.cjs</text>
<rect x="590" y="378" width="400" height="146" rx="16" fill="#f1edff" stroke="#aa9bd0" stroke-width="2"/>
<text x="616" y="414" class="head">Behavioral / biometric agent</text><text x="616" y="446" class="body">New device or SIM · impossible travel</text><text x="616" y="472" class="body">Scripted input · device-sharing evidence</text><text x="616" y="503" class="small">server/agents/behavioral-biometric.cjs</text>
<rect x="1134" y="378" width="418" height="146" rx="16" fill="#eaf7f1" stroke="#91bea6" stroke-width="2"/>
<text x="1160" y="414" class="head">Graph-network agent</text><text x="1160" y="446" class="body">Cycles · fan-in · pass-through flows</text><text x="1160" y="472" class="body">Shared identities · multi-hop propagation</text><text x="1160" y="503" class="small">server/agents/graph-network.cjs</text>

<path d="M246 524V558H790M790 524V558M1343 524V558H790V575" fill="none" stroke="#526985" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="48" y="592" class="lane">4 · POLICY, LOCAL STATE AND RESPONSE</text>
<rect x="535" y="578" width="510" height="148" rx="16" fill="#fff3dc" stroke="#dfb35f" stroke-width="2"/>
<text x="562" y="614" class="head">Decision orchestrator</text><text x="562" y="644" class="body">Blend = 0.6 × max(agent score) + 0.4 × mean(agent scores)</text>
<rect x="562" y="665" width="135" height="36" rx="9" fill="#ffe6e3"/><text x="629" y="689" text-anchor="middle" class="body">&gt; 0.85 · BLOCK</text>
<rect x="710" y="665" width="135" height="36" rx="9" fill="#fff0d1"/><text x="777" y="689" text-anchor="middle" class="body">blend &gt; .60 · HOLD</text>
<rect x="858" y="665" width="160" height="36" rx="9" fill="#e4f5eb"/><text x="938" y="689" text-anchor="middle" class="body">otherwise · APPROVE</text>
<path d="M790 558V568" stroke="#526985" stroke-width="2.5" marker-end="url(#arrow)"/>

<path d="M1045 652H1093" stroke="#526985" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1105" y="578" width="447" height="148" rx="16" fill="#fff" stroke="#aebed1" stroke-width="2"/>
<text x="1131" y="614" class="head">Local records + analyst UI</text><text x="1131" y="644" class="body">APPROVE → commit record · HOLD → review queue</text>
<text x="1131" y="670" class="body">BLOCK → stop before settlement · registry / audit</text>
<text x="1131" y="701" class="small">data/ append-only local journals · response refreshes graph + tabs</text>

<text x="48" y="772" class="lane">5 · DRUNIX LEDGER COMMIT AND READBACK · REQUIRED BY DEFAULT</text>
<rect x="46" y="792" width="450" height="116" rx="16" fill="#eef1f6" stroke="#9aa9bb" stroke-width="2"/>
<text x="72" y="828" class="head">Node DRUNIX adapter</text><text x="72" y="858" class="body">Submits hashed identities + agent scores</text><text x="72" y="884" class="small">server/ledger/drunix-client.cjs</text>
<rect x="575" y="792" width="450" height="116" rx="16" fill="#eef1f6" stroke="#9aa9bb" stroke-width="2"/>
<text x="601" y="828" class="head">Go chaincode contracts</text><text x="601" y="858" class="body">Evaluate · ResolveHold · fraud registry</text><text x="601" y="884" class="small">chaincode/trustmesh/ · AuditTrail</text>
<rect x="1105" y="792" width="447" height="116" rx="16" fill="#eef1f6" stroke="#9aa9bb" stroke-width="2"/>
<text x="1131" y="828" class="head">DRUNIX ledger + readback</text><text x="1131" y="858" class="body">Decision + audit verified before response</text><text x="1131" y="884" class="small">Synthetic transactions only · no payment settlement</text>
<path d="M496 850H565M1025 850H1095" stroke="#3976c5" stroke-width="3" marker-end="url(#blueArrow)"/>
<path d="M790 726V750H271V782" fill="none" stroke="#3976c5" stroke-width="3" marker-end="url(#blueArrow)"/>
<rect x="1243" y="735" width="309" height="34" rx="10" fill="#f4f7fb"/><text x="1397" y="758" text-anchor="middle" class="small">Response waits for verified ledger state</text>
</svg>
